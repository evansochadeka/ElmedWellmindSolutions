<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="HzFd4jLBlbEmktxR8XoUh8H7SBQAn72BDgKZt0OmMWo" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6C63FF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Elmed Wellmind">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/static/icons/icon-152x152.png">
    
    <!-- Windows Tiles -->
    <meta name="msapplication-TileColor" content="#6C63FF">
    <meta name="msapplication-TileImage" content="/static/icons/icon-144x144.png">
    
    <title>{% block title %}Elmed Wellmind Solutions | Mental Wellness Kenya{% endblock %}</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #FF6584;
            --accent: #36D1DC;
            --light: #F8F9FF;
            --dark: #2A2D43;
            --success: #4CC9A7;
            --warning: #FF9F1C;
            --text: #333344;
            --white: #FFFFFF;
            --gradient-primary: linear-gradient(135deg, #6C63FF 0%, #36D1DC 100%);
            --gradient-secondary: linear-gradient(135deg, #FF6584 0%, #FF9F1C 100%);
            --gradient-dark: linear-gradient(135deg, #2A2D43 0%, #1A1D33 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--light);
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: var(--dark);
        }

        .container {
            width: 90%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 70px;
            position: relative;
            z-index: 5;
        }

        .section-title h2 {
            font-size: 3.2rem;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .section-title h2 span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-title p {
            max-width: 700px;
            margin: 0 auto;
            color: #666;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(108, 99, 255, 0.5);
        }

        .btn-secondary {
            background: var(--gradient-secondary);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 101, 132, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 101, 132, 0.5);
        }

        /* Floating Buttons */
        .floating-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }

        .floating-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .floating-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .whatsapp-btn {
            background: #25D366;
        }

        .call-btn {
            background: var(--primary);
        }

        .ai-chat-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 100%);
        }

        .donate-btn-float {
            background: var(--secondary);
        }

        .btn-label {
            position: absolute;
            right: 70px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9rem;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.3s;
            pointer-events: none;
        }

        .floating-btn:hover .btn-label {
            opacity: 1;
            transform: translateX(0);
        }

        /* Responsive Styles */
        @media (max-width: 992px) {
            .section-title h2 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .section-title h2 {
                font-size: 2.2rem;
            }
            
            .floating-buttons {
                bottom: 20px;
                right: 20px;
            }
            
            .floating-btn {
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 576px) {
            .section-title h2 {
                font-size: 2rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'header.html' %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% include 'footer.html' %}
    
    {% include 'floating-buttons.html' %}
    
    {% block scripts %}
    <script>
        // Global configuration
        const API_BASE = window.location.origin + '/api';
        let chatSessionId = localStorage.getItem('chatSessionId') || 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chatSessionId', chatSessionId);
        
        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} minute${diffMins !== 1 ? 's' : ''} ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours !== 1 ? 's' : ''} ago`;
            if (diffDays < 7) return `${diffDays} day${diffDays !== 1 ? 's' : ''} ago`;
            
            return date.toLocaleDateString('en-KE', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }
        
        // Prevent all anchor links from scrolling
        document.addEventListener('DOMContentLoaded', function() {
            // Override all anchor link clicks
            document.addEventListener('click', function(e) {
                const target = e.target.closest('a');
                if (!target) return;
                
                const href = target.getAttribute('href');
                
                // Check if it's an anchor link (starts with #)
                if (href && href.startsWith('#')) {
                    e.preventDefault();
                    
                    // Instead of scrolling, we just prevent default
                    // This keeps the page at the top
                    console.log('Anchor link prevented:', href);
                    return false;
                }
            });
            
            console.log('Elmed Wellmind Solutions loaded successfully');
            my tests <br >
 <a href =https://docs.google.com/forms/d/1r5k8K39PfbNweDPWlI-8_EBI6iAfz6s5fXTaVAZNqcI/edit> stress test</a>

            // Make phone numbers clickable
            document.querySelectorAll('.phone-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    if(this.getAttribute('href').startsWith('tel:')) {
                        return; // For call links, they work naturally
                    }
                });
            });
        });
    </script>
    {% endblock %}
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registered with scope:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', function() {
                            const newWorker = registration.installing;
                            console.log('ServiceWorker update found!');
                        });
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker registration failed:', error);
                    });
                
                // Check for PWA install prompt
                let deferredPrompt;
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    console.log('Install prompt available');
                    
                    // You could show a custom install button here
                });
            });
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
